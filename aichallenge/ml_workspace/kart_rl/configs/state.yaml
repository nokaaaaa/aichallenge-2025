seed: 42

track:
  csv_path: "../../workspace/src/aichallenge_submit/simple_trajectory_generator/data/raceline_cctb_30km_wide.csv"
  lane_csv_path: "lane.csv"
  format: "raceline"
  half_width_m: 3.0
  curvature_scale: 12.0

vehicle:
  wheelbase_m: 1.087
  width_m: 1.45
  length_m: 1.8
  max_speed_mps: 4.165
  min_speed_mps: 0.0
  max_accel_mps2: 3.0
  max_brake_mps2: 5.0
  max_steer_rad: 0.75
  max_steer_rate_radps: 3.0

env:
  type: "state"
  action_dim: 1
  dt: 0.05
  max_episode_steps: 4000
  start_pose_awsim:
    x: 89633.29
    y: 43127.57
    orientation:
      z: 0.8778
      w: 0.4788
  start_noise_m: 0.1
  start_noise_yaw_rad: 0.03
  finish_on_start_straight_exit: true
  finish_laps: 1
  min_moving_speed_mps: 0.5
  max_stopped_steps: 120
  boundary_margin_m: 0.15
  obstacle_vehicle_count: 3
  obstacle_min_gap_m: 8.0
  obstacle_start_clearance_m: 8.0
  obstacle_lateral_margin_m: 0.25
  obstacle_start_straight_only: true
  obstacle_straight_curvature_threshold: 0.035
  obstacle_straight_sample_step_m: 0.5
  obstacle_placement_attempts: 2000
  localization_delay_sec: 0.5
  steering_delay_sec: 0.2
  pure_pursuit_lookahead_base_m: 2.0
  pure_pursuit_lookahead_speed_gain: 0.8
  max_steer_correction_ratio: 0.10

reward:
  progress: 35.0
  speed: 0.04
  lateral_error: 1.2
  heading_error: 0.5
  steer: 0.01
  action_smooth: 0.02
  wasted_motion: 2.5
  low_speed: 0.08
  stopped: 120.0
  wall_collision: 300.0
  lap_complete: 1000.0

train:
  algorithm: ppo
  device: "cuda"
  total_timesteps: 500000
  n_envs: 4
  model_path: "models/ppo_kart"
  tensorboard_log: "runs/tensorboard"
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 256
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2

viewer:
  model_path: "models/ppo_kart"
  rollout_path: "rollouts/latest.npz"
  fps: 50
