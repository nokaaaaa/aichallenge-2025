seed: 42

track:
  csv_path: "../../workspace/src/aichallenge_submit/simple_trajectory_generator/data/raceline_cctb_30km_wide.csv"
  lane_csv_path: "lane.csv"
  format: "raceline"
  half_width_m: 3.0
  curvature_scale: 12.0

lidar:
  angle_min: -1.5666074752807617
  angle_max: 1.5707963705062866
  angle_increment: 0.004188789986073971
  time_increment: 0.00006666666740784422
  scan_time: 0.05000000074505806
  range_min: 0.0
  range_max: 25.0
  sample_ratio: 0.5
  frame_stack: 4
  ray_chunk_size: 64
  include_vehicle_state: true
  include_obstacle_state: false

vehicle:
  wheelbase_m: 1.087
  width_m: 1.45
  length_m: 1.8
  max_speed_mps: 4.165
  min_speed_mps: 0.0
  max_accel_mps2: 3.0
  max_brake_mps2: 5.0
  max_steer_rad: 0.75
  max_steer_rate_radps: 3.0

env:
  type: "lidar"
  action_dim: 1
  lidar_steering_mode: "pure_pursuit_correction"
  dt: 0.05
  max_episode_steps: 4000
  start_pose_awsim:
    x: 89633.29
    y: 43127.57
    orientation:
      z: 0.8778
      w: 0.4788
  start_noise_m: 0.0
  start_noise_yaw_rad: 0.0
  finish_on_start_straight_exit: true
  finish_laps: 1
  min_moving_speed_mps: 0.5
  max_stopped_steps: 120
  boundary_margin_m: 0.15
  obstacle_vehicle_count: 3
  fixed_obstacles:
    - s_offset_m: 11.0
      lateral_m: -1.9
    - s_offset_m: 20.0
      lateral_m: -1.9
    - s_offset_m: 27.0
      lateral_m: -1.9
  obstacle_min_gap_m: 8.0
  obstacle_start_clearance_m: 8.0
  obstacle_lateral_margin_m: 0.25
  obstacle_start_straight_only: true
  obstacle_straight_curvature_threshold: 0.035
  obstacle_straight_sample_step_m: 0.5
  obstacle_avoidance_lookahead_m: 24.0
  obstacle_clearance_m: 1.55
  wall_clearance_m: 1.30
  obstacle_placement_attempts: 2000
  localization_delay_sec: 0.5
  steering_delay_sec: 0.2
  pure_pursuit_lookahead_base_m: 2.0
  pure_pursuit_lookahead_speed_gain: 0.8
  max_steer_correction_ratio: 0.25

reward:
  progress: 45.0
  speed: 0.02
  lateral_error: 0.0
  heading_error: 0.25
  steer: 0.01
  action_smooth: 0.01
  wasted_motion: 1.0
  hazard_avoidance: 4.0
  low_speed: 0.08
  stopped: 120.0
  wall_collision: 300.0
  obstacle_collision: 300.0
  lap_complete: 1000.0

train:
  algorithm: ppo
  device: "cuda"
  total_timesteps: 800000
  n_envs: 4
  model_path: "models/ppo_kart_lidar"
  tensorboard_log: "runs/tensorboard_lidar"
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  curriculum:
    - timesteps: 0
      obstacle_vehicle_count: 0
      max_speed_mps: 1.6
      localization_delay_sec: 0.0
      steering_delay_sec: 0.0
      max_steer_correction_ratio: 0.15
    - timesteps: 100000
      obstacle_vehicle_count: 0
      max_speed_mps: 2.2
      localization_delay_sec: 0.15
      steering_delay_sec: 0.05
      max_steer_correction_ratio: 0.18
    - timesteps: 200000
      obstacle_vehicle_count: 1
      max_speed_mps: 2.6
      localization_delay_sec: 0.25
      steering_delay_sec: 0.10
      max_steer_correction_ratio: 0.22
    - timesteps: 325000
      obstacle_vehicle_count: 2
      max_speed_mps: 3.0
      localization_delay_sec: 0.35
      steering_delay_sec: 0.15
      max_steer_correction_ratio: 0.25
    - timesteps: 450000
      obstacle_vehicle_count: 3
      max_speed_mps: 3.4
      localization_delay_sec: 0.45
      steering_delay_sec: 0.20
      max_steer_correction_ratio: 0.25
    - timesteps: 600000
      obstacle_vehicle_count: 3
      max_speed_mps: 4.165
      localization_delay_sec: 0.5
      steering_delay_sec: 0.2
      max_steer_correction_ratio: 0.25

viewer:
  model_path: "models/ppo_kart_lidar"
  rollout_path: "rollouts/latest_lidar.npz"
  fps: 50
