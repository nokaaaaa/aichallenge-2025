seed: 42

track:
  csv_path: "lane.csv"
  format: "lane_boundaries"
  half_width_m: "auto"
  curvature_scale: 12.0

vehicle:
  wheelbase_m: 1.087
  width_m: 1.45
  length_m: 1.8
  max_speed_mps: 8.33
  min_speed_mps: 0.0
  max_accel_mps2: 3.2
  max_brake_mps2: 5.0
  max_steer_rad: 0.75
  max_steer_rate_radps: 3.0

env:
  dt: 0.05
  max_episode_steps: 2400
  start_noise_m: 0.25
  start_noise_yaw_rad: 0.08
  finish_laps: 1
  min_moving_speed_mps: 0.5
  max_stopped_steps: 80

reward:
  progress: 18.0
  speed: 0.08
  lateral_error: 0.8
  heading_error: 0.15
  steer: 0.02
  action_smooth: 0.03
  wasted_motion: 2.0
  low_speed: 0.04
  stopped: 80.0
  wall_collision: 120.0
  lap_complete: 250.0

train:
  algorithm: ppo
  device: "cuda"
  total_timesteps: 100000
  n_envs: 4
  model_path: "models/ppo_kart"
  tensorboard_log: "runs/tensorboard"
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 256
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2

viewer:
  model_path: "models/ppo_kart.zip"
  rollout_path: "rollouts/latest.npz"
  fps: 50
