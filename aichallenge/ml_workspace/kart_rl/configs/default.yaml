seed: 42

track:
  csv_path: "../../workspace/src/aichallenge_submit/simple_trajectory_generator/data/raceline_cctb_30km_wide.csv"
  lane_csv_path: "lane.csv"
  format: "raceline"
  half_width_m: 3.0
  curvature_scale: 12.0

lidar:
  angle_min: -1.5666074752807617
  angle_max: 1.5707963705062866
  angle_increment: 0.004188789986073971
  time_increment: 0.00006666666740784422
  scan_time: 0.05000000074505806
  range_min: 0.0
  range_max: 25.0
  sample_ratio: 0.5
  ray_chunk_size: 64

vehicle:
  wheelbase_m: 1.087
  width_m: 1.45
  length_m: 1.8
  max_speed_mps: 4.165
  min_speed_mps: 0.0
  max_accel_mps2: 3.0
  max_brake_mps2: 5.0
  max_steer_rad: 0.75
  max_steer_rate_radps: 3.0

env:
  type: "lidar"
  dt: 0.05
  max_episode_steps: 4000
  start_noise_m: 0.1
  start_noise_yaw_rad: 0.03
  finish_laps: 1
  min_moving_speed_mps: 0.5
  max_stopped_steps: 120
  boundary_margin_m: 0.15
  pure_pursuit_lookahead_base_m: 2.0
  pure_pursuit_lookahead_speed_gain: 0.8
  max_steer_correction_ratio: 0.10

reward:
  progress: 35.0
  speed: 0.04
  lateral_error: 1.2
  heading_error: 0.5
  steer: 0.01
  action_smooth: 0.02
  wasted_motion: 2.5
  low_speed: 0.08
  stopped: 120.0
  wall_collision: 300.0
  lap_complete: 1000.0

train:
  algorithm: ppo
  device: "cuda"
  total_timesteps: 500000
  n_envs: 4
  model_path: "models/ppo_kart_lidar"
  tensorboard_log: "runs/tensorboard_lidar"
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2

viewer:
  model_path: "models/ppo_kart_lidar.zip"
  rollout_path: "rollouts/latest_lidar.npz"
  fps: 50
