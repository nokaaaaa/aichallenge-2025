[project]
name = "kart-rl"
version = "0.1.0"
description = "Gymnasium + Stable-Baselines3 racing kart RL workspace for AI Challenge"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "gymnasium>=0.29.1",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pygame>=2.5.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "stable-baselines3>=2.3.0",
    "tensorboard>=2.16.0",
    "torch>=2.3.0,<3.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
kart-rl-train = "kart_rl.train:main"
kart-rl-eval = "kart_rl.evaluate:main"
kart-rl-viewer = "kart_rl.viewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
